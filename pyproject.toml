[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streets-at-night"
version = "0.1.0"
description = "Aerial city night renderer using OpenStreetMap data"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=1.9",
    "geopandas>=0.14",
    "shapely>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyproj>=3.6",
    "tomli-w>=1.0",
    "pygame>=2.5",
    "pygame-gui>=0.6",
    "Pillow>=10.0",
    "torch>=2.1",
    "imageio[ffmpeg]>=2.34",
    "wgpu>=0.32.0",
    "rendercanvas>=2.7.2",
    "glfw>=2.11.0",
    "imgui-bundle>=1.92.0,<1.92.900",
]

[project.scripts]
streets-at-night = "streets_at_night.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streets_at_night"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
