# ---------------------------------------------------------------------------
# House lights — residential window, porch, and interior lighting
# ---------------------------------------------------------------------------
[lights.house_lights]
# House light brightness range (0.0–1.0)
brightness_min = 0.3
brightness_max = 0.6
# Window/porch light halo glow radius in meters
glow_radius = 6.0
# Ground illumination radius from house lights in meters
illumination_radius = 8.0
# Ground illumination intensity (0.0–1.0)
illumination_intensity = 0.35

# House light color pool: 45% warm yellow, 25% warm white, 15% amber, 15% TV blue
[lights.house_lights.colors]
colors = [
    ["#FFE4A0", 0.45],
    ["#FFF0D0", 0.25],
    ["#FFCC80", 0.15],
    ["#D0E0FF", 0.15],
]

# ---------------------------------------------------------------------------
# Atmosphere — distance-based haze and light scatter
# ---------------------------------------------------------------------------
[atmosphere]
# Distance in meters at which light intensity falls to ~37% (1/e)
falloff_distance = 999999999999
# Haze tint color applied to distant geometry (hex)
haze_color = "#3A2010"
# Distance in meters at which scatter glow begins to dominate
scatter_distance = 10000.0
# Maximum render distance in meters; geometry beyond this is clipped
max_distance = 20000.0
# Whether glow radius expands with distance (atmospheric scatter effect)
glow_expansion_enabled = false
# Maximum opacity of the glow halo center ring (0–255); scaled further by brightness
glow_max_alpha = 80
# Gaussian sigma multiplier for glow falloff; higher = gentler/wider falloff
glow_falloff_steepness = 1.0
# Skip lights whose effective brightness (after falloff) drops below this fraction
min_brightness_threshold = 0.05
# Base maximum alpha (0–255) for ground illumination splats; scaled by each light's illumination_intensity and brightness
illumination_brightness = 60
illumination_min_radius = 15.0
