# default_scene_config.toml
#
# Fully-populated default configuration for Streets at Night.
# Every key that can appear in scene_config.toml is present here, set to its
# default value.  Copy this file, rename it scene_config.toml, and modify
# only the values you want to change.
#
# The loader deep-merges your file onto these defaults, so you only need to
# include the keys you are overriding.  Lists (e.g. fixture pools, color pools)
# are replaced wholesale — not merged element by element.
#
# NOTE ON FIXTURE POOLS: TOML has no null literal.  Pool entries with no
# profile (meaning "no streetlights on this segment") are written as an
# [[array of tables]] entry with only a weight key — no profile sub-table.
# The loader calls entry.get("profile"), so a missing key yields None and is
# treated correctly as a no-lights entry.

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
[camera]
# Latitude of the camera eye point (WGS84 degrees)
lat = 34.234880959491356
# Longitude of the camera eye point (WGS84 degrees)
lon = -117.31157772457728
# Camera altitude above sea level in feet
altitude_ft = 5186.0
# Latitude of the camera look-at target (WGS84 degrees)
target_lat = 34.10834722093596
# Longitude of the camera look-at target (WGS84 degrees)
target_lon = -117.29681238769862
# Target altitude above sea level in feet
target_altitude_ft = 1000.0
# Vertical field of view in degrees
fov = 60.0
# Near clip plane distance in meters
near = 100.0
# Far clip plane distance in meters
far = 60000.0

# ---------------------------------------------------------------------------
# Geographic bounds — OSM data download bounding box
# ---------------------------------------------------------------------------
[bounds]
# Northern latitude limit (WGS84 degrees)
north = 34.35
# Southern latitude limit (WGS84 degrees)
south = 33.95
# Eastern longitude limit (WGS84 degrees)
east = -117.05
# Western longitude limit (WGS84 degrees)
west = -117.55

# ---------------------------------------------------------------------------
# Global seed — controls all random placement (lights, cars, house colors)
# ---------------------------------------------------------------------------
# Integer seed for the random number generator
seed = 42

# ---------------------------------------------------------------------------
# Quality presets — select with --quality low | medium | high
# ---------------------------------------------------------------------------
[quality.low]
# Output image width in pixels
width = 1920
# Output image height in pixels
height = 1080
# Illumination pass resolution relative to output size
illumination_resolution_multiplier = 0.5
# Ground tile texels per meter (higher = finer detail)
ground_tile_resolution = 4.0

[quality.medium]
# Output image width in pixels
width = 3840
# Output image height in pixels
height = 2160
# Illumination pass resolution relative to output size
illumination_resolution_multiplier = 0.75
# Ground tile texels per meter (higher = finer detail)
ground_tile_resolution = 2.0

[quality.high]
# Output image width in pixels
width = 7680
# Output image height in pixels
height = 4320
# Illumination pass resolution relative to output size
illumination_resolution_multiplier = 1.0
# Ground tile texels per meter (higher = finer detail)
ground_tile_resolution = 1.0

# ---------------------------------------------------------------------------
# Zone colors — very dark ambient base tones for each land-use type
# ---------------------------------------------------------------------------
[zones.colors]
# Base fill color for commercial zones
commercial = "#0A0A0C"
# Base fill color for industrial zones
industrial = "#080808"
# Base fill color for parks and forested areas
park_forest = "#040804"
# Base fill color for water bodies
water = "#040408"
# Base fill color for road surfaces (unlit)
road_surface = "#0C0C0C"
# Fallback ground color for unmapped land
default_ground = "#080706"

# ---------------------------------------------------------------------------
# Zone rendering — tile grid dimensions
# ---------------------------------------------------------------------------
[zones]
# Ground tile width/height in ENU meters
tile_size_meters = 256.0
# Ground tile texture resolution in pixels (per tile)
tile_resolution_px = 128

# ---------------------------------------------------------------------------
# House generation within residential zones
# ---------------------------------------------------------------------------
[zones.house]
# Base color for yard / lot ground
yard_base_color = "#060A04"
# Per-pixel brightness variation on the yard (0–255 range additive noise)
yard_variation = 2
# Minimum number of window/porch lights per house
min_lights = 0
# Maximum number of window/porch lights per house
max_lights = 5
# Probability weights for 0..max_lights light counts
light_weights = [5.0, 3.0, 1.5, 0.5, 0.3, 0.1]
# Fraction of lot area covered by the building footprint
footprint_coverage = 0.65
# Typical lot width in meters
lot_width = 15.0
# Typical lot depth in meters
lot_depth = 25.0
# Front-of-lot setback distance in meters
setback = 10.0

# Exterior wall color pool: each entry is [hex_color, weight]
[zones.house.exterior_colors]
colors = [
    ["#0D0A08", 1.0],
    ["#0C0907", 1.0],
    ["#0B0808", 1.0],
    ["#0A0907", 1.0],
    ["#0C0A09", 1.0],
]

# ---------------------------------------------------------------------------
# Road rendering — export pass (static render, dark asphalt tones)
# ---------------------------------------------------------------------------
[roads.export.highway]
# Unlit road surface color for freeway / motorway
color = "#141210"
# Base line width in pixels at 1:1 scale
width = 4

[roads.export.major_road]
# Unlit road surface color for major arterials
color = "#121010"
# Base line width in pixels at 1:1 scale
width = 3

[roads.export.collector]
# Unlit road surface color for collector roads
color = "#100E0E"
# Base line width in pixels at 1:1 scale
width = 2

[roads.export.residential]
# Unlit road surface color for residential streets
color = "#0E0C0C"
# Base line width in pixels at 1:1 scale
width = 1

[roads.export.service]
# Unlit road surface color for service roads / alleys
color = "#0C0A0A"
# Base line width in pixels at 1:1 scale
width = 1

[roads.export.minor]
# Unlit road surface color for minor / unnamed roads
color = "#0A0908"
# Base line width in pixels at 1:1 scale
width = 1

# ---------------------------------------------------------------------------
# Road rendering — preview pass (interactive pygame view, bright colors)
# ---------------------------------------------------------------------------
[roads.preview.highway]
# Preview color for freeway / motorway
color = "#FFD700"
# Base line width in pixels at preview scale
width = 4

[roads.preview.major_road]
# Preview color for major arterials
color = "#FF6B35"
# Base line width in pixels at preview scale
width = 3

[roads.preview.collector]
# Preview color for collector roads
color = "#FFFFFF"
# Base line width in pixels at preview scale
width = 2

[roads.preview.residential]
# Preview color for residential streets
color = "#888888"
# Base line width in pixels at preview scale
width = 1

[roads.preview.service]
# Preview color for service roads / alleys
color = "#555555"
# Base line width in pixels at preview scale
width = 1

[roads.preview.minor]
# Preview color for minor / unnamed roads
color = "#64647A"
# Base line width in pixels at preview scale
width = 1

# ---------------------------------------------------------------------------
# Streetlights — weighted fixture pools per road type
#
# Each [[lights.streetlights.<road_type>]] entry selects a fixture at random
# according to its weight.  Entries with no profile represent unlit segments.
# See the note at the top of this file about the TOML null limitation.
# ---------------------------------------------------------------------------

# Highway: 90% high-pressure sodium, 10% LED white
[[lights.streetlights.highway]]
# Selection weight relative to other entries in this pool
weight = 0.9
[lights.streetlights.highway.profile]
# Lamp color (hex)
color = "#FFA040"
# Pole height range in meters
height_min = 12.0
height_max = 15.0
# Lamp brightness range (0.0–1.0)
brightness_min = 0.85
brightness_max = 1.0
# Halo glow radius in meters
glow_radius = 25.0
# Ground illumination circle radius in meters
illumination_radius = 40.0
# Ground illumination intensity (0.0–1.0)
illumination_intensity = 0.9
# Along-road spacing range in meters
spacing_min = 40.0
spacing_max = 60.0
# Which side(s) of the road: "both", "one", or "alternating"
side = "both"

[[lights.streetlights.highway]]
weight = 0.1
[lights.streetlights.highway.profile]
color = "#E0E8FF"
height_min = 12.0
height_max = 15.0
brightness_min = 0.85
brightness_max = 1.0
glow_radius = 25.0
illumination_radius = 40.0
illumination_intensity = 0.9
spacing_min = 40.0
